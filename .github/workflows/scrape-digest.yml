name: scrape-digest

on:
  schedule:
    # 06:00, 10:00, 14:00, 18:00, 22:00 MSK.
    - cron: '0 3,7,11,15,19 * * *'
  workflow_dispatch:

concurrency:
  group: job-agent-scrape-digest
  cancel-in-progress: false

jobs:
  scrape-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PUBLIC_BASE_URL: https://job-agent-ecru.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check required secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" || -z "$GEMINI_API_KEY" || -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping scrape-digest: SUPABASE, GEMINI and Telegram secrets are required."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run scrape-digest
